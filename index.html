<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoviXoHub Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block; 
            position: absolute; 
            top: 0; 
            left: 0; 
            background: #000; 
        }
        .loader { 
            position: absolute; 
            inset: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            background: #000; 
            z-index: 10; 
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <div id="loader" class="loader">Loading player...</div>
    
    <iframe
        id="video-frame"
        src="about:blank"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen>
    </iframe>

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const type = (params.get('type') || 'movie').toLowerCase();
            const id = params.get('id');
            const season = params.get('season') || '1';
            const episode = params.get('episode') || '1';

            const iframe = document.getElementById('video-frame');
            const loader = document.getElementById('loader');

            if (!id) {
                loader.textContent = 'Error: No ID provided.';
                return;
            }

            let targetUrl = '';
            
            if (type === 'anime' || type === 'tv') {
                // Nxsha uses TMDB ID and Season/Episode for both
                targetUrl = `https://web.nxsha.app/embed/tv/${id}/${season}/${episode}`;
            } else {
                // Movies with the Nitro server added
                targetUrl = `https://web.nxsha.app/embed/movie/${id}?server=Nitro%20-%20%5BMulti-Lang%5D`;
            }

            iframe.onload = () => {
                if (loader) loader.style.display = 'none';
            };
            
            iframe.src = targetUrl;
        })();
    </script>
</body>
</html>
