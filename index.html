<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoviXoHub Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        iframe { width: 100%; height: 100%; border: none; display: block; position: absolute; top: 0; left: 0; background: #000; }
    </style>
</head>
<body>
    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const type = (params.get('type') || 'movie').toLowerCase();
            const id = params.get('id');
            const season = params.get('season') || '1';
            const episode = params.get('episode') || '1';

            if (!id) {
                document.body.innerHTML = '<h1 style="color:white; text-align:center; margin-top:20%">Error: No ID</h1>';
                return;
            }

            let targetUrl = '';
            
            if (type === 'anime' || type === 'tv') {
                targetUrl = `https://web.nxsha.app/embed/tv/${id}/${season}/${episode}`;
            } else {
                targetUrl = `https://web.nxsha.app/embed/movie/${id}?server=Nitro%20-%20%5BMulti-Lang%5D`;
            }

            const iframe = document.createElement('iframe');
            iframe.src = targetUrl;
            iframe.allow = "autoplay; fullscreen; encrypted-media; picture-in-picture";
            iframe.allowFullscreen = true;
            document.body.appendChild(iframe);
        })();
    </script>
</body>
</html>
