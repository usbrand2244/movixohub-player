<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoviXoHub Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        iframe { width: 100%; height: 100%; border: none; display: block; position: absolute; top: 0; left: 0; }
    </style>
</head>
<body>
    <script>
        const params = new URLSearchParams(window.location.search);
        const type = (params.get('type') || 'movie').toLowerCase();
        const id = params.get('id');
        const season = params.get('season') || '1';
        const episode = params.get('episode') || '1';

        let targetUrl = '';
        if (type === 'anime') {
            targetUrl = `https://vidbolt.pro/anime/${id}/${episode}/sub`;
        } else if (type === 'tv') {
            targetUrl = `https://vidbolt.pro/tv/${id}/${season}/${episode}`;
        } else {
            targetUrl = `https://vidbolt.pro/movie/${id}`;
        }

        const proxyUrl = `https://movixohub-player.vercel.app/?url=${encodeURIComponent(targetUrl)}`;
        
        const iframe = document.createElement('iframe');
        iframe.src = proxyUrl;
        iframe.allow = "autoplay; fullscreen; encrypted-media; picture-in-picture";
        iframe.allowFullscreen = true;
        document.body.appendChild(iframe);
    </script>
</body>
</html>
